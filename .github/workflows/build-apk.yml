name: Bouw Gesigneerde KlusBazen APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Code ophalen
        uses: actions/checkout@v4

      - name: 2. Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Java 21 instellen (voor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Pakketten installeren & webapp bouwen
        run: |
          npm install
          npm run build

      - name: 5. Android-project, icoon, splash screen & versienummer genereren
        run: |
          npx cap add android

          echo "=== Check assets/ map ==="
          if [ ! -d "assets" ]; then
            echo "❌ Map 'assets/' bestaat niet! Maak een map 'assets/' aan met je logo."
            exit 1
          fi
          ls -la assets/

          # Zoek automatisch het logo-bestand (ongeacht .png/.jpg/.jpeg/.webp of hoofdletters)
          SOURCE_LOGO=$(find assets -maxdepth 1 -type f \( -iname "icon-only.*" -o -iname "logo.*" -o -iname "icon.*" \) | head -n 1)
          if [ -z "$SOURCE_LOGO" ]; then
            echo "❌ Geen logo gevonden in assets/! Upload bijv. assets/icon-only.png of assets/logo.jpg"
            exit 1
          fi
          echo "✅ Bronlogo gevonden: $SOURCE_LOGO"

          # Maak alle bestanden die @capacitor/assets nodig heeft voor Adaptive Icons + Splash Screen
          node -e "
            const sharp = require('sharp');
            const src = process.argv[1];
            (async () => {
              // 1. Standaard icoon (1024x1024)
              await sharp(src)
                .resize(1024, 1024, { fit: 'cover' })
                .png()
                .toFile('assets/icon-only.png.tmp');

              // 2. Adaptive Icon voorgrond (700x700 gecentreerd op 1024x1024 zodat ronde maskers niets afsnijden)
              const fgLogo = await sharp(src)
                .resize(700, 700, { fit: 'contain', background: '#153E75' })
                .png()
                .toBuffer();

              await sharp({
                create: { width: 1024, height: 1024, channels: 4, background: '#153E75' }
              })
                .composite([{ input: fgLogo, gravity: 'center' }])
                .png()
                .toFile('assets/icon-foreground.png');

              // 3. Adaptive Icon achtergrond (effen donkerblauw)
              await sharp({
                create: { width: 1024, height: 1024, channels: 4, background: '#153E75' }
              })
                .png()
                .toFile('assets/icon-background.png');

              // 4. Stijlvol Splash Screen (2732x2732) op basis van het KlusBazen-logo
              const splashBgSvg = Buffer.from(\`
                <svg width="2732" height="2732" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="bgGrad" cx="50%" cy="46%" r="62%">
                      <stop offset="0%" stop-color="#2257A0" />
                      <stop offset="55%" stop-color="#153E75" />
                      <stop offset="100%" stop-color="#0B2245" />
                    </radialGradient>
                    <radialGradient id="glow" cx="50%" cy="46%" r="32%">
                      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.22" />
                      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
                    </radialGradient>
                  </defs>
                  <rect width="2732" height="2732" fill="url(#bgGrad)" />
                  <circle cx="1366" cy="1260" r="780" fill="url(#glow)" />

                  <!-- Subtiele decoratieve sterretjes rondom het logo -->
                  <path d="M920 820 L932 855 L967 867 L932 879 L920 914 L908 879 L873 867 L908 855 Z" fill="#FBBF24" opacity="0.85" />
                  <path d="M1840 900 L1849 926 L1875 935 L1849 944 L1840 970 L1831 944 L1805 935 L1831 926 Z" fill="#FBBF24" opacity="0.75" />
                  <path d="M1790 1630 L1798 1652 L1820 1660 L1798 1668 L1790 1690 L1782 1668 L1760 1660 L1782 1652 Z" fill="#FFFFFF" opacity="0.55" />
                  <circle cx="960" cy="1640" r="10" fill="#FBBF24" opacity="0.6" />
                  <circle cx="1760" cy="830" r="8" fill="#FFFFFF" opacity="0.45" />
                  <circle cx="860" cy="1260" r="7" fill="#FFFFFF" opacity="0.35" />

                  <!-- Ondertitel onder het logo -->
                  <text
                    x="1366"
                    y="1855"
                    text-anchor="middle"
                    font-family="DejaVu Sans, Arial, sans-serif"
                    font-size="56"
                    font-weight="700"
                    letter-spacing="2"
                    fill="#FDE68A"
                  >Samen klussen, samen vieren!</text>
                </svg>
              \`);

              // Afgerond masker voor het gecentreerde logo op het splash screen
              const logoSize = 860;
              const roundedMask = Buffer.from(\`
                <svg width="\${logoSize}" height="\${logoSize}" xmlns="http://www.w3.org/2000/svg">
                  <rect width="\${logoSize}" height="\${logoSize}" rx="190" ry="190" fill="#ffffff" />
                </svg>
              \`);

              const splashLogo = await sharp(src)
                .resize(logoSize, logoSize, { fit: 'cover' })
                .composite([{ input: roundedMask, blend: 'dest-in' }])
                .png()
                .toBuffer();

              await sharp(splashBgSvg)
                .composite([
                  { input: splashLogo, left: Math.round((2732 - logoSize) / 2), top: 830 }
                ])
                .png()
                .toFile('assets/splash.png.tmp');

              console.log('✅ Alle asset-PNGs (Adaptive Icon + aangepast Splash Screen) succesvol aangemaakt');
            })().catch(err => { console.error(err); process.exit(1); });
          " "$SOURCE_LOGO"

          mv assets/icon-only.png.tmp assets/icon-only.png
          mv assets/splash.png.tmp assets/splash.png
          cp assets/splash.png assets/splash-dark.png

          # Bewaar de hash van het standaard Capacitor-icoon VOOR het genereren
          BEFORE_HASH=$(md5sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png | awk '{print $1}')

          echo "=== Genereer Android iconen & splash screens ==="
          npx capacitor-assets generate --android --iconBackgroundColor '#153E75' --splashBackgroundColor '#153E75' --splashBackgroundColorDark '#153E75'

          # Controleer of ic_launcher_foreground.png nu echt is overschreven!
          AFTER_HASH=$(md5sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png | awk '{print $1}')
          echo "Hash ic_launcher_foreground VOOR: $BEFORE_HASH"
          echo "Hash ic_launcher_foreground NA:   $AFTER_HASH"

          if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
            echo "❌ FOUT: ic_launcher_foreground.png is NIET overschreven door capacitor-assets!"
            exit 1
          fi
          echo "✅ Adaptive Icon & Splash Screen zijn succesvol gegenereerd!"

          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: 6. Release APK compileren
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. APK uitlijnen (zipalign) & signeren (apksigner)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Strip eventuele onzichtbare enters uit de secrets
          export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          export KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          echo "Check: lengte KEYSTORE_PASSWORD = ${#KEYSTORE_PASSWORD} tekens"
          echo "Check: lengte KEY_PASSWORD = ${#KEY_PASSWORD} tekens"
          echo "Check: KEY_ALIAS = '$KEY_ALIAS'"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "❌ Een of meer GitHub Secrets zijn leeg! Controleer de exacte spelling onder Settings → Secrets and variables → Actions."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.jks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            app-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "KlusBazen-v1.0.${{ github.run_number }}.apk" \
            app-aligned.apk

          "$BUILD_TOOLS/apksigner" verify "KlusBazen-v1.0.${{ github.run_number }}.apk"
          rm -f release.jks app-aligned.apk

      - name: 8. Gesigneerde APK beschikbaar maken als artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlusBazen-v1.0.${{ github.run_number }}-APK
          path: KlusBazen-v1.0.${{ github.run_number }}.apk

      - name: 9. Publiceren onder GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "KlusBazen-v1.0.${{ github.run_number }}.apk" \
            --title "KlusBazen v1.0.${{ github.run_number }}" \
            --notes "Automatisch gebouwde en gesigneerde Android-release van KlusBazen."
