name: Bouw Gesigneerde KlusBazen APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Code ophalen
        uses: actions/checkout@v4

      - name: 2. Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Java 21 instellen (voor Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Pakketten installeren, logo klaarzetten & webapp bouwen
        run: |
          npm install

          echo "=== Check assets/ map ==="
          if [ ! -d "assets" ]; then
            echo "❌ Map 'assets/' bestaat niet! Maak een map 'assets/' aan met je logo."
            exit 1
          fi
          ls -la assets/

          SOURCE_LOGO=$(find assets -maxdepth 1 -type f \( -iname "icon-only.*" -o -iname "logo.*" -o -iname "icon.*" \) | head -n 1)
          if [ -z "$SOURCE_LOGO" ]; then
            echo "❌ Geen logo gevonden in assets/! Upload bijv. assets/icon-only.png of assets/logo.jpg"
            exit 1
          fi
          echo "✅ Bronlogo gevonden: $SOURCE_LOGO"

          # Kopieer logo naar public/logo.png zodat het schermvullende splash screen in index.html het direct kan tonen
          mkdir -p public
          SOURCE_LOGO="$SOURCE_LOGO" node << 'EOF'
            const sharp = require('sharp');
            sharp(process.env.SOURCE_LOGO)
              .resize(512, 512, { fit: 'cover' })
              .png()
              .toFile('public/logo.png')
              .then(() => console.log('✅ public/logo.png aangemaakt voor het splash screen'))
              .catch((err) => { console.error(err); process.exit(1); });
          EOF

          npm run build

      - name: 5. Android-project, icoon, naadloos splash thema & versienummer genereren
        run: |
          npx cap add android

          SOURCE_LOGO=$(find assets -maxdepth 1 -type f \( -iname "icon-only.*" -o -iname "logo.*" -o -iname "icon.*" \) | head -n 1)

          # Maak alle bestanden die @capacitor/assets nodig heeft voor Adaptive Icons + effen donkerblauwe fallback splash
          SOURCE_LOGO="$SOURCE_LOGO" node << 'EOF'
            const sharp = require('sharp');
            const src = process.env.SOURCE_LOGO;

            (async () => {
              // 1. Standaard icoon (1024x1024)
              await sharp(src)
                .resize(1024, 1024, { fit: 'cover' })
                .png()
                .toFile('assets/icon-only.png.tmp');

              // 2. Adaptive Icon voorgrond (700x700 gecentreerd op 1024x1024 zodat ronde maskers niets afsnijden)
              const fgLogo = await sharp(src)
                .resize(700, 700, { fit: 'contain', background: '#153E75' })
                .png()
                .toBuffer();

              await sharp({
                create: { width: 1024, height: 1024, channels: 4, background: '#153E75' }
              })
                .composite([{ input: fgLogo, gravity: 'center' }])
                .png()
                .toFile('assets/icon-foreground.png');

              // 3. Adaptive Icon achtergrond (effen donkerblauw)
              await sharp({
                create: { width: 1024, height: 1024, channels: 4, background: '#153E75' }
              })
                .png()
                .toFile('assets/icon-background.png');

              // 4. Effen donkerblauwe fallback splash (geen dubbel/wazig logo vóór het echte splash screen)
              await sharp({
                create: { width: 2732, height: 2732, channels: 4, background: '#153E75' }
              })
                .png()
                .toFile('assets/splash.png.tmp');

              console.log('✅ Alle asset-PNGs succesvol aangemaakt');
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          EOF

          mv assets/icon-only.png.tmp assets/icon-only.png
          mv assets/splash.png.tmp assets/splash.png
          cp assets/splash.png assets/splash-dark.png

          BEFORE_HASH=$(md5sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png | awk '{print $1}')

          echo "=== Genereer Android iconen & splash screens ==="
          npx capacitor-assets generate --android --iconBackgroundColor '#153E75' --splashBackgroundColor '#153E75' --splashBackgroundColorDark '#153E75'

          AFTER_HASH=$(md5sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png | awk '{print $1}')
          if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
            echo "❌ FOUT: ic_launcher_foreground.png is NIET overschreven door capacitor-assets!"
            exit 1
          fi

          # Transparant 1dp-icoon aanmaken zodat Android 12+ geen eerste (wazig) logo toont vóór ons eigen splash screen
          mkdir -p android/app/src/main/res/drawable
          cat << 'XML' > android/app/src/main/res/drawable/transparent_splash_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@android:color/transparent" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          XML

          # Android 12+ Splash Screen thema instellen voor zowel lichte als donkere modus (effen #153E75, geen dubbel logo)
          for DIR in values-v31 values-night-v31; do
            mkdir -p "android/app/src/main/res/$DIR"
            cat << 'XML' > "android/app/src/main/res/$DIR/styles.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#153E75</item>
                  <item name="android:windowSplashScreenBackground">#153E75</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
                  <item name="android:windowBackground">#153E75</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          XML
          done

          echo "✅ Adaptive Icon & naadloos Android 12+ Splash Thema (zonder dubbel logo) zijn succesvol gegenereerd!"

          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: 6. Release APK compileren
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. APK uitlijnen (zipalign) & signeren (apksigner)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Strip eventuele onzichtbare enters uit de secrets
          export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          export KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          echo "Check: lengte KEYSTORE_PASSWORD = ${#KEYSTORE_PASSWORD} tekens"
          echo "Check: lengte KEY_PASSWORD = ${#KEY_PASSWORD} tekens"
          echo "Check: KEY_ALIAS = '$KEY_ALIAS'"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "❌ Een of meer GitHub Secrets zijn leeg! Controleer de exacte spelling onder Settings → Secrets and variables → Actions."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.jks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            app-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "KlusBazen-v1.0.${{ github.run_number }}.apk" \
            app-aligned.apk

          "$BUILD_TOOLS/apksigner" verify "KlusBazen-v1.0.${{ github.run_number }}.apk"
          rm -f release.jks app-aligned.apk

      - name: 8. Gesigneerde APK beschikbaar maken als artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlusBazen-v1.0.${{ github.run_number }}-APK
          path: KlusBazen-v1.0.${{ github.run_number }}.apk

      - name: 9. Publiceren onder GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "KlusBazen-v1.0.${{ github.run_number }}.apk" \
            --title "KlusBazen v1.0.${{ github.run_number }}" \
            --notes "Automatisch gebouwde en gesigneerde Android-release van KlusBazen."
