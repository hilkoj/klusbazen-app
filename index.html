<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KlusBazen</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #153E75;
      }
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 44%, #2257A0 0%, #153E75 55%, #0B2245 100%);
        transition: opacity 0.45s ease;
        user-select: none;
        -webkit-user-select: none;
      }
      #initial-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #initial-splash .splash-glow {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(251, 191, 36, 0.28) 0%, rgba(251, 191, 36, 0) 70%);
        filter: blur(28px);
        pointer-events: none;
      }
      #initial-splash .splash-card {
        position: relative;
        z-index: 1;
        width: 192px;
        height: 192px;
        border-radius: 36px;
        overflow: hidden;
        background: #153E75;
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #initial-splash .splash-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #initial-splash .splash-tagline {
        position: relative;
        z-index: 1;
        margin-top: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #FDE68A;
        text-align: center;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" onclick="this.remove()">
      <div class="splash-glow"></div>
      <div class="splash-card">
        <img
          src="/logo.png"
          alt="KlusBazen"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;font-family:system-ui,sans-serif;font-weight:900;font-size:32px;line-height:1;color:#FCD34D;&quot;>KLUS</div><div style=&quot;font-family:system-ui,sans-serif;font-weight:900;font-size:32px;line-height:1;color:#FFFFFF;&quot;>BAZEN</div>';"
        />
      </div>
      <div class="splash-tagline">Samen klussen, samen vieren!</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var splash = document.getElementById('initial-splash');
        if (!splash) return;
        setTimeout(function () {
          splash.classList.add('fade-out');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 500);
        }, 1600);
      })();
    </script>
  </body>
</html>
